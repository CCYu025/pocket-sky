name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The unit tests need no installed packages (axe-core is only used by the e2e tests).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Same steps as the `e2e` job of ci.yml: nothing is deployed unless the browser tests pass too.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y playwright@1.63.0 install --with-deps chromium
      # Make the library resolvable for the tests without adding it to package.json.
      - run: npm i --no-save playwright@1.63.0
      - run: npm run test:e2e

  deploy:
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: building the site uses only Node built-ins.
      - name: Assemble _site (runtime files only, sw-assets.js and the sw.js version stamp included)
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
