name: Open-Meteo contract

# Calls the real Open-Meteo APIs once a day to detect response-shape changes.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:contract
