<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#FFF7D6">
<title>Pocket Sky</title>
<script src="js/theme-boot.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <span class="brand">POCKET SKY</span>
    <button type="button" class="key loc-btn" id="loc-btn" data-action="open-picker" data-mode="current" aria-haspopup="dialog">定位中… <span aria-hidden="true">▾</span></button>
  </header>
  <main id="view" tabindex="-1" aria-busy="true"></main>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <footer class="foot"><a class="attribution" id="attribution" rel="noopener" target="_blank"></a></footer>
  <nav class="nav" aria-label="主選單">
    <button type="button" class="key light" data-action="light" aria-pressed="false" aria-label="LIGHT 切換日夜主題">LIGHT</button>
    <a class="key" id="nav-today" href="#today">今天</a>
    <a class="key" id="nav-outing" href="#outing">外出</a>
  </nav>
  <dialog id="picker" class="pk-dlg" aria-labelledby="pk-title"></dialog>
  <noscript><p class="notice">Pocket Sky 需要啟用 JavaScript。</p></noscript>
</div>
</body>
</html>
